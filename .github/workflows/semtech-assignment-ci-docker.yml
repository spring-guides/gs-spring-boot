name: Semtech Assignment CI-CD

on:
  push:
    branches:
      - feature/**
      - main

jobs:
  build:
    uses: ./.github/workflows/reusable-java-build.yml

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: complete/target

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: complete
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/hello-app:${{ env.SHORT_SHA }} .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/hello-app:${{ env.SHORT_SHA }}

    gitops:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: Narayan1989/myapphelm-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in Helm values
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          cd gitops/myapp-chart

          sed -i "s/tag:.*/tag: \"$SHORT_SHA\"/g" values.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add values.yaml
          git commit -m "Update image tag to $SHORT_SHA"
          git push    